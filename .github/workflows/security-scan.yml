name: Container Security Scan

on:
push:
branches:
- main
workflow_dispatch:
schedule:
- cron: '0 2 * * 1'

permissions:
contents: read
security-events: write
actions: read

jobs:
scan:
name: Scan ${{ matrix.image.name }}
runs-on: self-hosted

```
strategy:
  fail-fast: false
  matrix:
    image:
      - name: oss-stack-fe
        ref: ghcr.io/xplurdata/oss-stack-fe:1.0.0
      - name: oss-stack-be
        ref: ghcr.io/xplurdata/oss-stack-be:1.0.0
      - name: oss-stack-app
        ref: ghcr.io/xplurdata/oss-stack-app:1.0.0
      - name: oss-stack-collector
        ref: ghcr.io/xplurdata/oss-stack-collector:1.0.0

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Pull image
    run: docker pull ${{ matrix.image.ref }}

  - name: Run Trivy scan
    uses: aquasecurity/trivy-action@0.28.0
    with:
      image-ref: ${{ matrix.image.ref }}
      format: sarif
      output: trivy-results.sarif
      scanners: vuln,secret,misconfig
      severity: CRITICAL,HIGH,MEDIUM
      ignore-unfixed: true

  - name: Upload results to GitHub Security
    uses: github/codeql-action/upload-sarif@v3
    with:
      sarif_file: trivy-results.sarif
      category: ${{ matrix.image.name }}
